<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Musical</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="img/musica.png">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="titulo">
        <div class="img">
        <img src="img/musica.png" width="30" height="30">
        </div>
        <div class="texto-acervo">
            <div class="acervo">ACERVO MUSICAL</div>
            <div class="subtitulo">Cadastre e organize suas músicas favoritas!</div>
        </div>
    </div>
    <div class="conteudo">
        <div class="bloco1">

        <h3>+ Nova Música</h3>

        <div class="linha-campos">

            <div class="campo">
                <label>Título</label>
                <input 
                    type="text" 
                    id="titulo" 
                    name="titulo" 
                    placeholder="Ex: Sinais">
            </div>

            <div class="campo">
                <label>Artista</label>
                <input 
                    type="text" 
                    id="artista" 
                    name="artista" 
                    placeholder="Ex: Luan Santana">
            </div>

        </div>


        <div class="linha-campos">

            <div class="campo">
                <label>Gênero</label>

                <select id="genero" name="genero">
                    <option value="#" disabled selected>
                        Selecione um gênero...
                    </option>
                </select>
            </div>

            <div class="campo">
                <label>Data de Lançamento</label>

                <input 
                    type="date" 
                    id="lancamento" 
                    name="lancamento" 
                    min="1990-01-01">
            </div>

        </div>


        <div class="linha-campos">

            <div class="campo">
                <label>Duração</label>

                <input 
                    type="text" 
                    id="duracao" 
                    name="duracao" 
                    placeholder="3:45">
            </div>

            <div class="campo">
                <label>Álbum</label>

                <input 
                    type="text" 
                    id="album" 
                    name="album" 
                    placeholder="Ex: O Nosso Tempo é Agora">
            </div>

        </div>


        <legend>Versão</legend>

        <div class="opcoes">

            <label>
                <input 
                    type="radio" 
                    id="estudio" 
                    name="versao" 
                    value="estudio">
                Estúdio
            </label>

            <label>
                <input 
                    type="radio" 
                    id="ao-vivo" 
                    name="versao" 
                    value="ao-vivo">
                Ao vivo
            </label>

            <label>
                <input 
                    type="radio" 
                    id="acustica" 
                    name="versao" 
                    value="acustica">
                Acústica
            </label>

        </div>


        <legend>Características</legend>

        <div class="opcoes">

            <label>
                <input 
                    type="checkbox" 
                    id="explicita" 
                    name="caracteristicas" 
                    value="explicita">
                Explícita
            </label>

            <label>
                <input 
                    type="checkbox" 
                    id="cover" 
                    name="caracteristicas" 
                    value="cover">
                Cover
            </label>

            <label>
                <input 
                    type="checkbox" 
                    id="remix" 
                    name="caracteristicas" 
                    value="remix">
                Remix
            </label>

            <label>
                <input 
                    type="checkbox" 
                    id="trilha_sonora" 
                    name="caracteristicas" 
                    value="trilha_sonora">
                Trilha Sonora
            </label>

        </div>


        <button onclick="cadastrar()">+ Cadastrar Música</button>

        </div>

        <div class="bloco2">
            <h1>♫ Músicas cadastradas</h1>
           
            <div id="lista-musicas">
                <div class="nenhuma-musica">

                    <div class="icone-vazio">
                        <img src="img/disco.png" alt="disco">
                    </div>

                    <h2>Nenhuma música cadastrada</h2>

                    <p>Preencha o formulário para começar.</p>

                </div>
            </div>
        </div>

    </div>

</body>
</html>
<script>

    function cadastrar() {
        
        var titulo = document.getElementById("titulo").value;
        var artista = document.getElementById("artista").value;
        var genero = document.getElementById("genero").value;
        var fkGenero = Number(genero);
        var lancamento = document.getElementById("lancamento").value;
        var duracao = document.getElementById("duracao").value;
        var tempo = duracao.split(":");
        var album = document.getElementById("album").value;
        var versao;

        if (document.getElementById("estudio").checked) {
            versao = "Estúdio";
        } else if (document.getElementById("ao-vivo").checked) {
            versao = "Ao vivo";
        } else if (document.getElementById("acustica").checked) {
            versao = "Acústica";
        }

        var explicita = document.getElementById("explicita").checked;
        var cover = document.getElementById("cover").checked;
        var remix = document.getElementById("remix").checked;
        var trilha = document.getElementById("trilha_sonora").checked;

        var agora = new Date();
        var dia = String(agora.getDate()).padStart(2, '0');
        var mes = String(agora.getMonth() + 1).padStart(2, '0');
        var ano = agora.getFullYear();
        var dataHoje = `${ano}-${mes}-${dia}`;
        var dataMinima = "1990-01-01";

        var minutos = Number(tempo[0]);
        var segundos = Number(tempo[1]);
        var duracaoEmSegundos = minutos * 60 + segundos;

        if (titulo == "" || artista == "" || album == "" || genero == "#" || versao == undefined) { 
            alert("Preencha todos os campos corretamente!");

        } else if (duracao == NaN || duracao == "" || tempo.length != 2 || isNaN(tempo[0]) || isNaN(tempo[1]) || tempo[0] < 0 
                    || tempo[0] > 19 || tempo[1] < 0 || tempo[1] > 59 || tempo[0] == "" || tempo[1] == "" || duracaoEmSegundos <= 0) { 
            alert("Duração inválida :( \nA duração da música deve ser maior que 0 segundos e menor do que 20 minutos e deve seguir o padrão 'mm:ss'!")
            
        } else if (lancamento == "" || lancamento > dataHoje || lancamento < dataMinima) {
            alert("Data de lançamento inválida :(")

        } else {

            var musica = {
            titulo: titulo,
            artista: artista,
            fkGenero: fkGenero,
            lancamento: lancamento,
            duracao: duracaoEmSegundos,
            album: album,
            versao: versao,
            explicita: explicita,
            cover: cover,
            remix: remix,
            trilha: trilha
            };

            console.log(musica);

            fetch("http://localhost:8080/musicas", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(musica)
            })
            .then(response => response.json())
            .then(data => {
                obterMusicas();
            });

        }

    }

    async function obterMusicas() {
        // await para esperar o backend responder antes de continuar
        var resposta = await fetch("http://localhost:8080/musicas");
        var musicas = await resposta.json(); 
        console.log(musicas);

        var listaMusicas = document.getElementById("lista-musicas");
        listaMusicas.innerHTML = "";

        if (musicas.length == 0) {

            listaMusicas.innerHTML = `
                <div class="nenhuma-musica">

                    <div class="icone-vazio">
                        <img src="img/disco.png" alt="disco">
                    </div>

                    <h2>Nenhuma música cadastrada</h2>

                    <p>Preencha o formulário para começar.</p>

                </div>
            `;

        } else {

            for (var i = musicas.length - 1; i > 0; i--) {
            
                var duracaoEmSegundos = musicas[i].duracao;
                var minutos = Math.floor(duracaoEmSegundos / 60);
                var segundos = duracaoEmSegundos - (minutos * 60);

                if (segundos < 10) {
                    segundos = "0" + segundos;
                }
                 
                var duracao = minutos + ":" + segundos;
                var caracteristicas = "";

                var lancamento = musicas[i].lancamento;
                var data = lancamento.split("-");
                var ano = data[0];
                var mes = data[1];
                var dia = data[2];
                var novaData = dia + "-" + mes + "-" + ano;

                if (musicas[i].explicita) {
                    caracteristicas += "<span>Explícita</span>";
                }

                if (musicas[i].cover) {
                    caracteristicas += "<span>Cover</span>";
                }

                if (musicas[i].remix) {
                    caracteristicas += "<span>Remix</span>";
                }

                if (musicas[i].trilha) {
                    caracteristicas += "<span>Trilha Sonora</span>";
                }

                listaMusicas.innerHTML += `
                    <div class="musica-card">

                        <div class="icone-musica">
                            ♪
                        </div>

                        <div class="info-musica">

                            <div class="titulo-genero">
                                <h2>${musicas[i].titulo}</h2>
                                <span class="genero-musica">${musicas[i].genero}</span>
                            </div>

                            <p class="artista-musica">${musicas[i].artista}</p>

                            <div class="detalhes-musica">
                                <span><img src="img/transmissao.png" alt="transmissao"> ${musicas[i].versao}</span>
                                <span><img src="img/calendario.png" alt="calendario"> ${novaData}</span>
                                <span><img src="img/relogio.png" alt="relogio"> ${duracao}</span>
                                <span><img src="img/disco.png" alt="disco"> ${musicas[i].album}</span>
                            </div>

                            <div class="caracteristicas-musica">
                                ${caracteristicas}
                            </div>

                        </div>

                    </div>
                `; 
            }
        }
        
    }

    async function obterGeneros() {
        var resposta = await fetch("http://localhost:8080/musicas/generos");
        var generos = await resposta.json();
        console.log(generos);

        var selectGenero = document.getElementById("genero");
        for (var i = 0; i < generos.length; i++) {
            selectGenero.innerHTML += `
                <option value="${generos[i].id}">
                    ${generos[i].nome}
                </option>
            `;
        }
    }

    
    obterMusicas();
    obterGeneros();
    
</script>
