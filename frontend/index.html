<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Musical</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="img/colcheia-rosa.png">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="titulo">
        <div class="img">
        <img src="img/colcheia-rosa.png" width="30" height="30">
        </div>
        <div class="texto-acervo">
            <div class="acervo">ACERVO MUSICAL</div>
            <div class="subtitulo">Cadastre e organize suas músicas favoritas</div>
        </div>
    </div>
    <div class="conteudo">
        <div class="bloco1">
            <h3>+ Nova Música</h3>

            <label>Título</label>
            <input 
                type="text" 
                id="titulo" 
                name="titulo"
                placeholder="Ex: Sinais">

            <label>Artista</label>
            <input 
                type="text" 
                id="artista" 
                name="artista"
                placeholder="Ex: Luan Santana">

            <label>Gênero</label>
            <select id="genero" name="genero">
                <option value="#" disabled selected>
                    Selecione um gênero...
                </option>
            </select>

            <label>Data de Lançamento</label>
            <input 
                type="date"
                id="lancamento"
                name="lancamento"
                placeholder="2024"
            >

            <label>Duração</label>
            <input 
                type="text"
                id="duracao"
                name="duracao"
                placeholder="3:45">
            
                
            <label>Álbum</label>
            <input 
                type="text"
                id="album"
                name="album"
                placeholder="Ex: A Night at the Opera">

            <legend>Versão</legend>

            <label>
                <input 
                    type="radio"
                    id="estudio"
                    name="versao"
                    value="estudio"
                >
                Estúdio
            </label>

            <label>
                <input 
                    type="radio"
                    id="ao-vivo"
                    name="versao"
                    value="ao-vivo"
                >
                Ao vivo
            </label>

            <label>
                <input 
                    type="radio"
                    id="acustica"
                    name="versao"
                    value="acustica"
                >
                Acústica
            </label>

            <legend>Características</legend>

            <label>
                <input 
                    type="checkbox"
                    id="explicita"
                    name="caracteristicas"
                    value="explicita"
                >
                Explícita
            </label>

            <label>
                <input 
                    type="checkbox"
                    id="cover"
                    name="caracteristicas"
                    value="cover"
                >
                Cover
            </label>

            <label>
                <input 
                    type="checkbox"
                    id="remix"
                    name="caracteristicas"
                    value="remix"
                >
                Remix
            </label>

            <label>
                <input 
                    type="checkbox"
                    id="trilha_sonora"
                    name="caracteristicas"
                    value="trilha_sonora"
                >
                Trilha Sonora
            </label>

            <button onclick="cadastrar()">+ Cadastrar Música</button>
        </div>
        <div class="bloco2">
            <h1>♫ Músicas cadastradas</h1>
            

            <label>Buscar música</label>

            <input
                type="search"
                id="buscar-musica"
                name="buscar-musica"
                placeholder="Buscar por título, artista, gênero, tag..."
            >
           
            <div id="lista-musicas">
            </div>
        </div>
    </div>

</body>
</html>
<script>

    function cadastrar() {
        var titulo = document.getElementById("titulo").value;
        var artista = document.getElementById("artista").value;
        var genero = document.getElementById("genero").value;
        var fkGenero = Number(genero);
        var lancamento = document.getElementById("lancamento").value;
        
        var duracao = document.getElementById("duracao").value;
        var tempo = duracao.split(":");
        var minutos = Number(tempo[0]);
        var segundos = Number(tempo[1]);
        var duracaoEmSegundos = minutos * 60 + segundos;

        // console.log(duracaoEmSegundos);
        var album = document.getElementById("album").value;
        var versao;

        if (document.getElementById("estudio").checked) {
            versao = "Estúdio";
        } else if (document.getElementById("ao-vivo").checked) {
            versao = "Ao vivo";
        } else if (document.getElementById("acustica").checked) {
            versao = "Acústica";
        }

        // console.log(versao);

        var explicita = document.getElementById("explicita").checked;
        var cover = document.getElementById("cover").checked;
        var remix = document.getElementById("remix").checked;
        var trilha = document.getElementById("trilha_sonora").checked;

        var musica = {
        titulo: titulo,
        artista: artista,
        fkGenero: fkGenero,
        lancamento: lancamento,
        duracao: duracaoEmSegundos,
        album: album,
        versao: versao,
        explicita: explicita,
        cover: cover,
        remix: remix,
        trilha: trilha
        };

        fetch("http://localhost:8080/musicas", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(musica)
        })
        .then(response => response.json())
        .then(data => {
            obterMusicas();
        });

    }

    async function obterMusicas() {
        // await para esperar o backend responder antes de continuar
        var resposta = await fetch("http://localhost:8080/musicas");
        var musicas = await resposta.json(); 
        console.log(musicas);

        var listaMusicas = document.getElementById("lista-musicas");
        listaMusicas.innerHTML = "";

        for (var i = 0; i < musicas.length; i++) {
            
            var duracaoEmSegundos = musicas[i].duracao;
            var minutos = Math.floor(duracaoEmSegundos / 60);
            var segundos = duracaoEmSegundos - (minutos * 60);
            if (segundos < 10) {
                segundos = "0" + segundos;
            }
            var duracao = minutos + ":" + segundos;
            var caracteristicas = "";

            if (musicas[i].explicita) {
                caracteristicas += "<span>Explícita</span>";
            }

            if (musicas[i].cover) {
                caracteristicas += "<span>Cover</span>";
            }

            if (musicas[i].remix) {
                caracteristicas += "<span>Remix</span>";
            }

            if (musicas[i].trilha) {
                caracteristicas += "<span>Trilha Sonora</span>";
            }

            listaMusicas.innerHTML += `
                <div>
                    ♪
                </div>

                <div>

                    <h2>${musicas[i].titulo}</h2>

                    <span>${musicas[i].genero}</span>

                    <p>${musicas[i].artista}</p>

                    <div>
                        <span>♬ ${musicas[i].versao}</span>
                        <span>▣ ${musicas[i].lancamento}</span>
                        <span>◷ ${duracao}</span>
                        <span>♧ ${musicas[i].album}</span>
                    </div>

                    <div> ${caracteristicas} </div>

                </div>
            ` 
        }
    }

    async function obterGeneros() {
        var resposta = await fetch("http://localhost:8080/musicas/generos");
        var generos = await resposta.json();
        console.log(generos);

        var selectGenero = document.getElementById("genero");
        for (var i = 0; i < generos.length; i++) {
            selectGenero.innerHTML += `
                <option value="${generos[i].id}">
                    ${generos[i].nome}
                </option>
            `;
        }
    }

    
    obterMusicas();
    obterGeneros();
    
</script>
